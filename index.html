<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <title>極速圖片上傳與短網址工具 - 自動複製剪貼簿</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',

      display: none;
    }

      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

            短網址產生器
          </h3>
          <div class="space-y-3">
            <div class="flex gap-2">
              <input type="url" id="longUrlInput" placeholder="請貼上或輸入欲縮短的原始長網址 (如: https://...)" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-indigo-500 shadow-sm" />

            <div id="shortUrlResult" class="hidden bg-indigo-50/50 border border-indigo-100 rounded-xl p-3 flex items-center justify-between gap-3 animate-fadeIn">

              </div>
              <div class="flex gap-2 flex-shrink-0">
                <button onclick="copyTextToClipboard(document.getElementById('shortUrlOutput').value)" class="p-2 bg-white hover:bg-slate-50 text-indigo-600 rounded-lg border border-indigo-200 shadow-sm transition-colors" title="複製連結">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                </button>
                <a id="shortUrlOpenLink" href="#" target="_blank" class="p-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm transition-colors" title="開啟網頁">

        <div id="dropzone" class="relative group cursor-pointer transition-all duration-300 rounded-2xl border-2 border-dashed border-slate-200 hover:border-emerald-500/50 bg-white/60 hover:bg-white/90 p-8 text-center flex flex-col items-center justify-center min-h-[220px] shadow-sm overflow-hidden">
          <input type="file" id="fileInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
          
          <div id="promptContainer" class="space-y-4 transition-all duration-300">
            <div class="mx-auto w-14 h-14 rounded-full bg-slate-50 flex items-center justify-center border border-slate-100 group-hover:scale-110 group-hover:border-emerald-500/20 group-hover:bg-emerald-50 transition-all duration-300">
              <svg class="w-7 h-7 text-slate-400 group-hover:text-emerald-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <div class="space-y-1">

            <div>

        </div>

        <div id="resultCard" class="hidden glass-card rounded-2xl p-6 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <h3 class="font-bold text-slate-800 flex items-center gap-2 text-sm">

                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>

              最新上傳成功
            </h3>
            <span class="text-xs text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200 font-medium">已自動複製圖片連結</span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div class="md:col-span-1 aspect-video md:aspect-square bg-slate-50 rounded-xl overflow-hidden relative border border-slate-100 flex items-center justify-center group">
              <img id="resultPreview" src="" alt="Uploaded Preview" class="object-contain w-full h-full max-h-48" />
              <div class="absolute inset-0 bg-white/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity duration-200">
                <a id="resultOpenLink" href="#" target="_blank" class="p-2 bg-white hover:bg-slate-50 rounded-lg text-xs text-slate-700 border border-slate-200 shadow-sm flex items-center gap-1">
                  新分頁開啟
                </a>
              </div>
            </div>

            <div class="md:col-span-2 space-y-3">
              <div class="space-y-1">
                <div class="flex justify-between items-center">
                  <label class="text-xs text-slate-400 block font-medium">圖片直連</label>
                  <button onclick="sendToShortener()" class="text-[11px] text-indigo-600 hover:text-indigo-700 font-medium flex items-center gap-0.5 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                    將此連結縮短
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                  </button>
                </div>
                <div class="flex gap-2">
                  <input type="text" id="resultUrl" readonly class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-600 focus:outline-none" />
                  <button id="copyBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs px-4 py-2 rounded-lg flex-shrink-0 shadow-sm">
                    複製連結

              <div class="flex gap-2">

                <button onclick="formatResultUrl('markdown')" id="fmt-markdown" class="px-2.5 py-1 text-xs rounded-md bg-transparent text-slate-400 font-mono">Markdown</button>
                <button onclick="formatResultUrl('html')" id="fmt-html" class="px-2.5 py-1 text-xs rounded-md bg-transparent text-slate-400 font-mono">HTML</button>
              </div>

              <div class="grid grid-cols-3 gap-2 bg-slate-50/80 p-2.5 rounded-lg border border-slate-100 text-center text-xs">
                <div>
                  <div class="text-slate-400">原始體積</div>
                  <div id="infoOriginalSize" class="font-medium text-slate-600">-</div>
                </div>
                <div>
                  <div class="text-slate-400">壓縮後體積</div>
                  <div id="infoCompressedSize" class="font-medium text-emerald-600">-</div>
                </div>
                <div>
                  <div class="text-slate-400">節省空間</div>
                  <div id="infoRatio" class="font-medium text-blue-500">-</div>
                </div>

          </div>

          <div class="border-t border-slate-100 pt-4 mt-2 space-y-3">
            <div class="flex items-center justify-between">
              <h4 class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                ICO 圖示轉換工具
              </h4>
            </div>
            <div class="flex gap-2 items-center">
              <select id="icoSize" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 focus:outline-none flex-1 shadow-sm">
                <option value="256" selected>256 x 256 (高畫質圖示，推薦)</option>
                <option value="128">128 x 128</option>
                <option value="64">64 x 64</option>
                <option value="48">48 x 48 (Windows 軟體圖示)</option>
                <option value="32">32 x 32 (標準桌面圖示)</option>
                <option value="16">16 x 16 (網頁 Favicon)</option>
              </select>
              <button onclick="exportToIco()" class="bg-slate-800 hover:bg-slate-700 text-white font-medium text-xs px-4 py-2 rounded-lg flex-shrink-0 shadow-sm">
                匯出並下載 ICO
              </button>

      <div class="space-y-6">
        
        <div class="glass-card rounded-2xl p-5 space-y-4 text-xs">

            <h4 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
              上傳配置 (已預設)
            </h4>
          </div>
          
          <div class="space-y-3">

                <option value="r2" selected>Cloudflare R2 (預設)</option>
                <option value="local">本地預設儲存</option>
                <option value="telegram">Telegram 儲存</option>
              </select>
            </div>

            <div class="space-y-1">
              <label class="text-slate-500 block font-medium">CDN 域名線路</label>
              <select id="cdnDomain" class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-2 text-slate-700 focus:outline-none">
                <option value="cloudflareimg.cdn.sn" selected>Cloudflare 預設 (cloudflareimg.cdn.sn)</option>
                <option value="img.scdn.io">失控的防禦系統 (img.scdn.io)</option>
                <option value="cloudflarecnimg.scdn.io">CloudFlare 中國優選</option>
                <option value="edgeoneimg.cdn.sn">腾讯 EdgeOne</option>
                <option value="esaimg.cdn1.vip">ESA 節點</option>
              </select>
            </div>

            <div class="space-y-1">
              <label class="text-slate-500 block font-medium">輸出格式優化</label>
              <select id="outputFormat" class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-2 text-slate-700 focus:outline-none">

                <option value="webp">WebP (省空間)</option>
                <option value="png">PNG (無損)</option>

            </div>

            <div class="pt-2 border-t border-slate-100">
              <label class="flex items-center gap-2 cursor-pointer mt-0.5">
                <input type="checkbox" id="pwdEnable" class="rounded text-emerald-500 border-slate-200 focus:ring-emerald-500" onchange="togglePasswordInput()" />
                <span class="text-slate-500">啟用密碼保護圖片</span>
              </label>
              <div id="passwordField" class="hidden mt-2">
                <input type="password" id="imagePassword" placeholder="輸入圖片存取密碼" class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 focus:outline-none" />
              </div>
            </div>
          </div>
        </div>

        <div class="glass-card rounded-2xl p-5 space-y-3 flex flex-col max-h-[280px]">
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <h4 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
              上傳歷史
            </h4>
            <button onclick="clearHistory()" class="text-[10px] text-slate-400 hover:text-red-500">清除</button>
          </div>
          <div id="historyList" class="space-y-2 overflow-y-auto no-scrollbar flex-1 text-xs">
            <div class="text-slate-400 text-center py-6" id="emptyHistoryText">暫無歷史紀錄</div>
          </div>

      </div>

    </div>

  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 px-4 py-3 rounded-xl bg-white border border-slate-100 shadow-xl text-slate-700 text-sm font-medium">
    <svg class="w-5 h-5 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    <span id="toastText">訊息提示</span>
  </div>

  <script>
    const API_ENDPOINT = 'https://img.scdn.io/api/v1.php';
    let rawImageUrl = ''; 
    let currentFileBlob = null; 
    
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const promptContainer = document.getElementById('promptContainer');
    const loadingContainer = document.getElementById('loadingContainer');
    const progressText = document.getElementById('progressText');
    const resultCard = document.getElementById('resultCard');
    const resultPreview = document.getElementById('resultPreview');
    const resultOpenLink = document.getElementById('resultOpenLink');
    const resultUrl = document.getElementById('resultUrl');
    const copyBtn = document.getElementById('copyBtn');
    
    const infoOriginalSize = document.getElementById('infoOriginalSize');
    const infoCompressedSize = document.getElementById('infoCompressedSize');
    const infoRatio = document.getElementById('infoRatio');

    function formatBytes(bytes, decimals = 2) {
      if (!bytes) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      toastText.innerText = message;
      
      if (isError) {
        toast.classList.remove('border-slate-100', 'text-slate-700');
        toast.classList.add('border-red-100', 'text-red-600', 'bg-red-50');
        toast.querySelector('svg').classList.add('text-red-500');
      } else {
        toast.classList.remove('border-red-100', 'text-red-600', 'bg-red-50');
        toast.classList.add('border-slate-100', 'text-slate-700', 'bg-white');
        toast.querySelector('svg').classList.remove('text-red-500');
      }

      toast.classList.remove('translate-y-10', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-10', 'opacity-0');
      }, 3000);
    }

    function copyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.top = "0";
      textArea.style.left = "0";
      textArea.style.position = "fixed";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      
      let successful = false;
      try { successful = document.execCommand('copy'); } catch (err) {}
      if (textArea.parentNode) { textArea.parentNode.removeChild(textArea); }
      
      if (successful) {
        showToast('已複製到剪貼簿！');
        return true;
      } else {
        showToast('複製失敗，請手動複製', true);
        return false;
      }
    }

    // === 新增：呼叫短網址 API 核心邏輯 ===
    async function generateShortUrl() {
      const longUrl = document.getElementById('longUrlInput').value.trim();
      if (!longUrl) {
        showToast('請先輸入要縮短的長網址！', true);
        return;
      }

      showToast('正在生成短網址...', false);

      try {
        // 利用目前的 API 架構，帶入「縮短網址」的動作參數
        const formData = new FormData();
        formData.append('action', 'shorten'); // 行動參數
        formData.append('url', longUrl);      // 原始長網址

        const responseData = await fetchWithRetry(API_ENDPOINT, {
          method: 'POST',
          body: formData
        });

        if (responseData.success || responseData.short_url) {
          const shortUrl = responseData.short_url || responseData.data?.short_url;
          
          const shortUrlResult = document.getElementById('shortUrlResult');
          const shortUrlOutput = document.getElementById('shortUrlOutput');
          const shortUrlOpenLink = document.getElementById('shortUrlOpenLink');
          
          shortUrlOutput.value = shortUrl;
          shortUrlOpenLink.href = shortUrl;
          
          shortUrlResult.classList.remove('hidden');
          copyTextToClipboard(shortUrl);
          showToast('短網址生成成功，已自動複製！');
        } else {
          showToast(responseData.message || responseData.error || '短網址生成失敗', true);
        }
      } catch (error) {
        console.error(error);
        showToast('網路請求異常，短網址生成失敗！', true);
      }
    }

    // 快捷鍵：點擊直接把圖片外鏈送去短網址生成器
    function sendToShortener() {
      if (!rawImageUrl) return;
      document.getElementById('longUrlInput').value = rawImageUrl;
      document.getElementById('longUrlInput').scrollIntoView({ behavior: 'smooth' });
      generateShortUrl();
    }

    function formatResultUrl(formatType) {
      if (!rawImageUrl) return;
      const formats = ['raw', 'markdown', 'html'];
      formats.forEach(f => {
        const btn = document.getElementById(`fmt-${f}`);
        if (f === formatType) {
          btn.classList.add('bg-white', 'text-slate-700', 'border-slate-200', 'shadow-sm');
        } else {
          btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-200', 'shadow-sm');
        }
      });

      if (formatType === 'markdown') {
        resultUrl.value = `![image](${rawImageUrl})`;
      } else if (formatType === 'html') {
        resultUrl.value = `<img src="${rawImageUrl}" alt="image" />`;
      } else {
        resultUrl.value = rawImageUrl;
      }
    }

    function togglePasswordInput() {
      const pwdEnable = document.getElementById('pwdEnable').checked;
      const passwordField = document.getElementById('passwordField');
      passwordField.className = pwdEnable ? "mt-2" : "hidden";
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add('border-emerald-400', 'bg-white');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove('border-emerald-400', 'bg-white');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) handleUpload(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (fileInput.files.length > 0) handleUpload(fileInput.files[0]);
    });

    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          handleUpload(items[i].getAsFile());
          break;
        }
      }
    });

    async function handleUpload(file) {
      if (!file) return;
      currentFileBlob = file;

      promptContainer.classList.add('hidden');
      loadingContainer.classList.remove('hidden');
      progressText.innerText = '圖片解析中...';

      const formData = new FormData();
      formData.append('image', file);
      formData.append('storage_destination', document.getElementById('storageDestination').value);
      formData.append('cdn_domain', document.getElementById('cdnDomain').value);
      formData.append('outputFormat', document.getElementById('outputFormat').value);

      if (document.getElementById('pwdEnable').checked && document.getElementById('imagePassword').value) {
        formData.append('password_enabled', 'true');
        formData.append('image_password', document.getElementById('imagePassword').value);
        formData.append('password_type', 'plain');
      }

      progressText.innerText = '圖片上傳至雲端儲存中...';

      try {
        const responseData = await fetchWithRetry(API_ENDPOINT, { method: 'POST', body: formData });

        if (responseData.success) {
          const uploadedUrl = responseData.url || responseData.data.url;
          rawImageUrl = uploadedUrl;
          
          resultUrl.value = uploadedUrl;
          resultPreview.src = uploadedUrl;
          resultOpenLink.href = uploadedUrl;

          formatResultUrl('raw');

          if (responseData.data) {
            infoOriginalSize.innerText = formatBytes(responseData.data.original_size);
            infoCompressedSize.innerText = formatBytes(responseData.data.compressed_size);
            infoRatio.innerText = `${responseData.data.compression_ratio}%`;
          } else {
            infoOriginalSize.innerText = formatBytes(file.size);
            infoCompressedSize.innerText = '自動優化';
            infoRatio.innerText = '100%';
          }

          copyTextToClipboard(uploadedUrl);
          resultCard.classList.remove('hidden');

          saveToHistory({
            url: uploadedUrl,
            filename: responseData.data?.filename || file.name,
            timestamp: new Date().toLocaleTimeString(),
            size: responseData.data?.compressed_size || file.size
          });
        } else {
          showToast(responseData.error || responseData.message || '上傳失敗！', true);
        }
      } catch (error) {
        showToast('網路連線異常，上傳失敗！', true);
      } finally {
        promptContainer.classList.remove('hidden');
        loadingContainer.classList.add('hidden');
        fileInput.value = '';
      }
    }

    async function fetchWithRetry(url, options, retries = 5, delay = 1000) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) throw new Error(`HTTP status ${response.status}`);
        return await response.json();
      } catch (error) {
        if (retries > 0) {
          await new Promise(res => setTimeout(res, delay));
          return fetchWithRetry(url, options, retries - 1, delay * 2);
        } else { throw error; }
      }
    }

    copyBtn.addEventListener('click', () => copyTextToClipboard(resultUrl.value));

    async function exportToIco() {
      const size = parseInt(document.getElementById('icoSize').value, 10);
      let imgSrc = currentFileBlob ? URL.createObjectURL(currentFileBlob) : rawImageUrl;

      if (!imgSrc) {
        showToast('請先上傳圖片！', true);
        return;
      }

      showToast('正在本地產生 ICO...', false);
      const img = new Image();
      if (!currentFileBlob) img.crossOrigin = 'anonymous';

      img.onload = function() {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, size, size);
          ctx.drawImage(img, 0, 0, size, size);

          canvas.toBlob(async function(blob) {
            if (!blob) return;
            const arrayBuffer = await blob.arrayBuffer();
            const pngBuffer = new Uint8Array(arrayBuffer);
            const icoHeader = new ArrayBuffer(22);
            const view = new DataView(icoHeader);
            
            view.setUint16(0, 0, true);
            view.setUint16(2, 1, true);
            view.setUint16(4, 1, true);
            
            const w = size >= 256 ? 0 : size;
            const h = size >= 256 ? 0 : size;
            view.setUint8(6, w);
            view.setUint8(7, h);
            view.setUint8(8, 0);
            view.setUint8(9, 0);
            view.setUint16(10, 1, true);
            view.setUint16(12, 32, true);
            view.setUint32(14, pngBuffer.length, true);
            view.setUint32(18, 22, true);
            
            const finalIcoBuffer = new Uint8Array(22 + pngBuffer.length);
            finalIcoBuffer.set(new Uint8Array(icoHeader), 0);
            finalIcoBuffer.set(pngBuffer, 22);
            
            const icoBlob = new Blob([finalIcoBuffer], { type: 'image/x-icon' });
            const downloadUrl = URL.createObjectURL(icoBlob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `favicon-${size}x${size}.ico`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
            showToast('ICO 下載已開始！');
          }, 'image/png');
        } catch (e) { showToast('ICO 生成失敗，可能受跨域 CORS 限制。', true); }
      };
      img.src = imgSrc;
    }

    function saveToHistory(item) {
      let history = JSON.parse(localStorage.getItem('img_cdn_history') || '[]');
      history = history.filter(h => h.url !== item.url);
      history.unshift(item);
      if (history.length > 30) history.pop();
      localStorage.setItem('img_cdn_history', JSON.stringify(history));
      renderHistory();
    }

    function clearHistory() {
      localStorage.removeItem('img_cdn_history');
      renderHistory();
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      const emptyHistoryText = document.getElementById('emptyHistoryText');
      const history = JSON.parse(localStorage.getItem('img_cdn_history') || '[]');

      const currentItems = historyList.querySelectorAll('.history-item');
      currentItems.forEach(el => el.remove());

      if (history.length === 0) {
        emptyHistoryText.classList.remove('hidden');
        return;
      }
      emptyHistoryText.classList.add('hidden');
      
      history.forEach(item => {
        const card = document.createElement('div');
        card.className = 'history-item history-card p-2 rounded-lg flex items-center justify-between gap-3 group cursor-pointer transition-all hover:bg-white shadow-sm';
        card.innerHTML = `
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <div class="w-8 h-8 rounded bg-slate-50 border overflow-hidden flex-shrink-0 flex items-center justify-center">
              <img src="${item.url}" alt="" class="object-cover w-full h-full" />
            </div>
            <div class="min-w-0 flex-1">
              <div class="truncate font-medium text-slate-700 text-[11px]">${item.filename}</div>
            </div>
          </div>
          <button class="copy-history-btn p-1 text-slate-400 hover:text-emerald-600 flex-shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
          </button>
        `;

        card.querySelector('.copy-history-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          copyTextToClipboard(item.url);
        });

        card.addEventListener('click', () => {
          rawImageUrl = item.url; currentFileBlob = null;
          resultUrl.value = item.url; resultPreview.src = item.url; resultOpenLink.href = item.url;
          formatResultUrl('raw');
          resultCard.classList.remove('hidden');
          copyTextToClipboard(item.url);
        });
        historyList.appendChild(card);
      });
    }

    window.onload = renderHistory;
  </script>
</body>
